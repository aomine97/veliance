name: Release

# Build the macOS DMGs and publish them to a GitHub Release.
# The in-app updater (Settings → Updates) reads the latest release and hands
# users the matching -arm64 / -x64 DMG.
#
# Trigger by pushing a version tag that matches package.json, e.g.:
#   npm version 2.1.0        # bumps package.json + creates the v2.1.0 tag
#   git push --follow-tags
# or run it manually from the Actions tab (workflow_dispatch) with a tag.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.1.0). Must match package.json version.'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Resolve tag
        id: tag
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Check tag matches package.json version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          TAG="${{ steps.tag.outputs.tag }}"
          echo "package.json: $PKG  ·  tag: $TAG"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG. Run 'npm version <x.y.z>' so they match."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build DMGs (arm64 + x64)
        run: npm run dmg

      - name: List artifacts
        run: ls -lh dist/*.dmg

      - name: Publish release
        run: |
          gh release create "${{ steps.tag.outputs.tag }}" dist/*.dmg \
            --title "Veliance ${{ steps.tag.outputs.tag }}" \
            --generate-notes \
            --verify-tag
