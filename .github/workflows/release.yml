name: Release

# Build, Developer ID-sign, notarize, and publish the macOS build to a GitHub
# Release — DMG + ZIP for each arch plus latest-mac.yml, the feed the in-app
# updater (electron-updater) reads for one-click installs.
#
# Cut a release by pushing a version tag that matches package.json:
#   npm version 2.2.0        # bumps package.json + creates the v2.2.0 tag
#   git push --follow-tags
# or run it manually from the Actions tab (workflow_dispatch) with a tag.
#
# Requires these repo secrets (Settings → Secrets and variables → Actions):
#   MAC_CERT_P12_BASE64   base64 of your Developer ID Application .p12
#   MAC_CERT_PASSWORD     password for that .p12
#   APPLE_API_KEY_P8      contents of your App Store Connect API key (.p8)
#   APPLE_API_KEY_ID      the key's Key ID
#   APPLE_API_ISSUER      the API key's Issuer ID
#   APPLE_TEAM_ID         your Apple Developer Team ID
# (GITHUB_TOKEN is provided automatically.)
#
# Alternative to the three APPLE_API_* secrets: APPLE_ID +
# APPLE_APP_SPECIFIC_PASSWORD (+ APPLE_TEAM_ID). electron-builder reads whichever
# set is present — swap the env below if you go that route.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.2.0). Must match package.json version.'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Resolve tag
        id: tag
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Check tag matches package.json version
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          TAG="${{ steps.tag.outputs.tag }}"
          echo "package.json: $PKG  ·  tag: $TAG"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $PKG. Run 'npm version <x.y.z>' so they match."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build, sign, notarize & publish
        env:
          # Developer ID Application certificate (electron-builder imports it)
          CSC_LINK: ${{ secrets.MAC_CERT_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          # Notarization via App Store Connect API key
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Publish to the GitHub Release for this tag
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "::error::MAC_CERT_P12_BASE64 is not set. Add the signing + notarization secrets (see the header of this workflow) before cutting a release."
            exit 1
          fi
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$KEY_PATH"
          export APPLE_API_KEY="$KEY_PATH"
          npm run release
          rm -f "$KEY_PATH"
